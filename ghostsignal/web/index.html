<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GhostSignal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --card: #111111; --hover: #171717; --border: #222222;
    --text: #fafafa; --muted: #8a8a8a; --faint: #5a5a5a;
    --green: #4ade80; --amber: #fbbf24; --red: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }

  /* header */
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .head .sp { flex: 1; }

  .btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: var(--hover); }
  .btn.solid { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .btn.solid:hover { opacity: .9; }

  /* summary */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--card); }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 22px; font-weight: 600; margin-top: 2px; }

  /* toolbar */
  .bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 200px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; outline: none; }
  .search:focus { border-color: #3a3a3a; }
  .tabs { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .tabs button { background: none; border: 0; padding: 5px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--hover); color: var(--text); }

  /* table */
  .table { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 96px 80px 64px 72px 110px 90px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--hover); }
  .row.th { cursor: default; color: var(--muted); font-size: 12px; padding-top: 10px; padding-bottom: 10px; }
  .row.th:hover { background: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .name { min-width: 0; }
  .name .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .m { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .BUY { color: var(--green); } .RESEARCH { color: var(--amber); } .PASS { color: var(--red); }
  .pos { color: var(--green); } .neg { color: var(--red); } .dim { color: var(--faint); }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--bg); border-left: 1px solid var(--border);
            transform: translateX(100%); transition: transform .2s ease; overflow-y: auto; padding: 24px; }
  .drawer.open { transform: none; }
  .drawer h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; line-height: 1.35; }
  .close { position: absolute; top: 16px; right: 16px; }
  .sec { margin-top: 24px; }
  .sec h3 { font-size: 12px; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .grid div { background: var(--card); padding: 10px 12px; }
  .grid .k { color: var(--muted); font-size: 11px; }
  .grid .v { font-weight: 500; font-variant-numeric: tabular-nums; }
  .big { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; }
  .big .score { font-size: 32px; font-weight: 600; }
  ul.list { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  ul.list li { padding: 4px 0; color: #cfcfcf; }
  ul.list li.warn { color: var(--amber); }
  .src { display: flex; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; background: var(--card); }
  .src .r { text-transform: capitalize; }
  .src .x { color: var(--muted); font-size: 12px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links a { border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .links a:hover { color: var(--text); background: var(--hover); }
  form.log { display: grid; grid-template-columns: 1fr 90px 70px auto; gap: 6px; }
  form.log input, .modal input, .modal select, .modal textarea { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none; width: 100%; }
  .status { display: flex; gap: 6px; flex-wrap: wrap; }

  /* modal */
  dialog.modal { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 14px; width: min(480px, calc(100% - 32px)); padding: 20px; }
  dialog.modal::backdrop { background: rgba(0,0,0,.6); }
  .modal h2 { font-size: 16px; margin: 0 0 4px; }
  .modal p { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .modal textarea { min-height: 110px; resize: vertical; }
  .modal .f { margin-bottom: 10px; }
  .modal .f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; display: none; max-width: calc(100% - 32px); }

  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: minmax(0, 1fr) auto; }
    .row > :nth-child(n+3) { display: none; }
    .row.th { display: none; }
    .row .pill { justify-self: end; }
    form.log { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">G</div>
    <div><h1>GhostSignal</h1><div class="sub" id="lastScan">—</div></div>
    <div class="sp"></div>
    <button class="btn" id="btnAdd">Add</button>
    <button class="btn solid" id="btnScan">Scan</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Buy now</div><div class="v BUY" id="sBuy">0</div></div>
    <div class="stat"><div class="k">To research</div><div class="v" id="sResearch">0</div></div>
    <div class="stat"><div class="k">Products tracked</div><div class="v" id="sProducts">0</div></div>
    <div class="stat"><div class="k">Network orders</div><div class="v" id="sOrders">0</div></div>
  </div>

  <div class="bar">
    <input class="search" id="search" placeholder="Search products">
    <div class="tabs" id="tabs">
      <button class="on" data-v="">All</button><button data-v="BUY">Buy</button><button data-v="RESEARCH">Research</button><button data-v="PASS">Pass</button>
    </div>
  </div>

  <div class="table" id="table"><div class="empty">Loading…</div></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<dialog class="modal" id="dlgAdd">
  <h2>Add products</h2>
  <p>Paste ASINs or Amazon links, or upload a file.</p>
  <div class="f"><textarea id="addText" placeholder="B06W9N8X9H&#10;https://amazon.com/dp/B00NLVM6WK"></textarea></div>
  <div class="f"><label>Or upload a file</label>
    <select id="impKind">
      <option value="orders">Amazon order history</option>
      <option value="products">Product list CSV (Stealth Seller, Keepa…)</option>
    </select>
  </div>
  <div class="f" id="buyerField"><label>Whose orders?</label><input id="impBuyer" value="me"></div>
  <div class="f"><input type="file" id="impFile" accept=".csv,.json,.txt" multiple></div>
  <div class="actions">
    <button class="btn" onclick="this.closest('dialog').close()">Cancel</button>
    <button class="btn solid" id="addGo">Add</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (x) => (typeof x === "number" ? (x < 0 ? "-$" : "$") + Math.abs(x).toFixed(2) : "—");
const pct = (x) => (typeof x === "number" ? Math.round(x * 100) + "%" : "—");
const num = (x) => (typeof x === "number" ? (x >= 1000 ? (x / 1000).toFixed(x >= 10000 ? 0 : 1) + "k" : String(x)) : "—");
const cls = (x) => (typeof x !== "number" ? "dim" : x > 0 ? "pos" : "neg");
const LABEL = { BUY: "Buy", RESEARCH: "Research", PASS: "Pass" };
const GATED = { ungated: ["Yes", "BUY"], approval: ["Needs approval", "RESEARCH"], blocked: ["No", "PASS"] };
function canSell(p) {
  if (GATED[p.gated]) return `<span class="${GATED[p.gated][1]}">${GATED[p.gated][0]}</span>`;
  const risk = p.enrichment?.gating_risk;
  return risk === "high" ? `<span class="RESEARCH">Likely gated?</span>` : `<span class="dim">Not checked</span>`;
}
let rows = [], verdict = "", query = "", openAsin = null, timer;

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t.h); t.h = setTimeout(() => (t.style.display = "none"), 3000); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return (r.headers.get("content-type") || "").includes("json") ? r.json() : r.text();
}
function ago(iso) {
  if (!iso) return "never";
  const m = (Date.now() - new Date(iso)) / 6e4;
  return m < 60 ? Math.max(1, Math.round(m)) + "m ago" : m < 1440 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago";
}

async function load() {
  const all = await api("/api/products");
  const s = await api("/api/stats");
  $("#sBuy").textContent = all.filter((r) => r.verdict === "BUY").length;
  $("#sResearch").textContent = all.filter((r) => r.verdict === "RESEARCH").length;
  $("#sProducts").textContent = s.products;
  $("#sOrders").textContent = s.orders;
  $("#lastScan").textContent = "Last scan " + ago(s.last_run);
  rows = all;
  render();
}

function render() {
  const q = query.toLowerCase();
  const list = rows.filter((r) => (!verdict || r.verdict === verdict) && (!q || `${r.asin} ${r.title} ${r.brand}`.toLowerCase().includes(q)));
  if (!rows.length) { $("#table").innerHTML = `<div class="empty">No products yet. Click <b>Add</b> to paste ASINs or upload your Amazon orders.</div>`; return; }
  $("#table").innerHTML = `<div class="row th"><div>Product</div><div>Signal</div><div class="num">Profit</div><div class="num">ROI</div><div class="num">Sales/mo</div><div>Can sell</div><div>Source</div></div>` +
    (list.length ? list.map((r) => `
    <div class="row" data-asin="${r.asin}">
      <div class="name"><div class="t">${esc(r.title || r.asin)}</div><div class="m">${esc(r.brand || "")}${r.brand ? " · " : ""}${r.asin}</div></div>
      <div><span class="pill ${r.verdict}">${LABEL[r.verdict]} · ${r.score}</span></div>
      <div class="num ${cls(r.economics.profit)}">${money(r.economics.profit)}</div>
      <div class="num ${cls(r.economics.roi)}">${pct(r.economics.roi)}</div>
      <div class="num">${num(r.snapshot?.monthly_sold)}</div>
      <div>${canSell(r)}</div>
      <div class="${r.best_source ? "" : "dim"}" style="text-transform:capitalize">${esc(r.best_source?.retailer || "—")}</div>
    </div>`).join("") : `<div class="empty">Nothing matches.</div>`);
}

function drawer(p) {
  const e = p.economics, s = p.snapshot || {};
  const cell = (k, v, c = "") => `<div><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;
  const stores = (p.enrichment?.likely_retailers?.length ? p.enrichment.likely_retailers : ["walmart", "target", "costco", "samsclub"])
    .concat(["walmart", "target", "costco", "samsclub", "google"]).filter((k, i, a) => p.links.retail[k] && a.indexOf(k) === i).slice(0, 6);
  $("#drawer").innerHTML = `
    <button class="btn close" id="closeBtn">Close</button>
    <div class="sub">${esc(p.brand || "")}${p.brand ? " · " : ""}${p.asin}</div>
    <h2 style="padding-right:64px">${esc(p.title || p.asin)}</h2>
    <div class="big"><span class="score ${p.verdict}">${p.score}</span><span class="pill ${p.verdict}">${LABEL[p.verdict]}</span></div>

    <div class="sec"><div class="grid">
      ${cell("Sell price", money(e.sale_price))}${cell("Your cost", money(e.cost))}${cell("Max cost", money(e.max_cost))}
      ${cell("Profit", money(e.profit), cls(e.profit))}${cell("ROI", pct(e.roi), cls(e.roi))}${cell("Fees", money((e.referral_fee || 0) + (e.fba_fee || 0) || null))}
      ${cell("Sales/mo", num(s.monthly_sold))}${cell("Rank", num(s.sales_rank))}${cell("Sellers", s.offer_count ?? "—")}
    </div></div>

    <div class="sec"><h3>Can you sell it?</h3>
      <div class="status">
        ${[["ungated", "Yes, ungated"], ["approval", "Needs approval"], ["blocked", "No"]].map(([k, l]) =>
          `<button class="btn ${p.gated === k ? GATED[k][1] : ""}" data-gated="${k}" ${p.gated === k ? 'style="border-color:currentColor"' : ""}>${l}</button>`).join("")}
        <a class="btn" href="${p.links.sellercentral}" target="_blank" rel="noopener">Check in Seller Central</a>
      </div>
      <div class="sub" style="margin-top:6px">${p.eligibility ? `Set ${p.eligibility.source === "spapi" ? "by Amazon" : "by you"} ${ago(p.eligibility.checked_at)}${p.eligibility.reason ? " · " + esc(p.eligibility.reason) : ""}` : "Not checked yet — tap one after you check."}
        ${p.eligibility?.approval_url ? ` · <a href="${esc(p.eligibility.approval_url)}" target="_blank" rel="noopener" style="text-decoration:underline">Request approval</a>` : ""}</div>
    </div>

    <div class="sec"><h3>Why</h3><ul class="list">
      ${p.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}
      ${p.flags.map((f) => `<li class="warn">${esc(f)}</li>`).join("")}
      ${p.enrichment?.notes ? `<li>${esc(p.enrichment.notes)}</li>` : ""}
    </ul></div>

    <div class="sec"><h3>Where to buy</h3>
      ${p.sources.map((x) => `<a class="src" href="${esc(x.url || p.links.retail[x.retailer]?.url || "#")}" target="_blank" rel="noopener">
        <span><span class="r">${esc(x.retailer)}</span>${x.pack_qty > 1 ? ` <span class="x">× ${x.pack_qty}</span>` : ""}${x.promo ? ` <span class="x">· ${esc(x.promo)}</span>` : ""}</span>
        <span>${money(x.price)}</span></a>`).join("") || `<div class="sub" style="margin-bottom:8px">No prices logged yet.</div>`}
      <div class="links" style="margin:10px 0">${stores.map((k) => `<a href="${esc(p.links.retail[k].url)}" target="_blank" rel="noopener">Search ${esc(p.links.retail[k].name)}</a>`).join("")}</div>
      <form class="log" id="logForm">
        <input name="retailer" placeholder="Store" required list="stores">
        <input name="price" type="number" step="0.01" placeholder="Price" required>
        <input name="pack_qty" type="number" min="1" placeholder="Qty">
        <button class="btn">Save</button>
      </form>
    </div>

    <div class="sec"><h3>Check</h3><div class="links">
      <a href="${p.links.amazon}" target="_blank" rel="noopener">Amazon</a>
      <a href="${p.links.keepa}" target="_blank" rel="noopener">Keepa</a>
      <a href="${p.links.ebay_sold}" target="_blank" rel="noopener">eBay sold</a>
    </div></div>

    <div class="sec"><h3>Mark as</h3><div class="status">
      ${["buy", "research", "watch", "pass", "dead"].map((st) => `<button class="btn" data-status="${st}" ${p.status === st ? 'style="border-color:#555"' : ""}>${st[0].toUpperCase() + st.slice(1)}</button>`).join("")}
    </div></div>`;
  $("#closeBtn").onclick = close;
  $("#logForm").onsubmit = async (ev) => {
    ev.preventDefault();
    const d = Object.fromEntries([...new FormData(ev.target)].filter(([, v]) => v !== ""));
    d.price = Number(d.price); if (d.pack_qty) d.pack_qty = Number(d.pack_qty);
    try { drawer(await api(`/api/products/${p.asin}/source`, d)); toast("Price saved"); load(); } catch (err) { toast(err.message); }
  };
  $("#drawer").querySelectorAll("[data-gated]").forEach((b) => (b.onclick = async () => {
    drawer(await api(`/api/products/${p.asin}/gated`, { status: b.dataset.gated })); toast("Saved"); load();
  }));
  $("#drawer").querySelectorAll("[data-status]").forEach((b) => (b.onclick = async () => {
    await api(`/api/products/${p.asin}/status`, { status: b.dataset.status });
    toast("Marked " + b.dataset.status); close(); load();
  }));
}

async function open(asin) {
  openAsin = asin;
  drawer(await api(`/api/products/${asin}`));
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
}
function close() { openAsin = null; $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }

$("#table").onclick = (ev) => { const r = ev.target.closest(".row[data-asin]"); if (r) open(r.dataset.asin); };
$("#scrim").onclick = close;
document.onkeydown = (ev) => { if (ev.key === "Escape") close(); };
$("#tabs").onclick = (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  [...$("#tabs").children].forEach((x) => x.classList.toggle("on", x === b));
  verdict = b.dataset.v; render();
};
$("#search").oninput = (ev) => { clearTimeout(timer); timer = setTimeout(() => { query = ev.target.value.trim(); render(); }, 150); };

$("#btnAdd").onclick = () => $("#dlgAdd").showModal();
$("#impKind").onchange = (ev) => ($("#buyerField").hidden = ev.target.value !== "orders");
$("#addGo").onclick = async () => {
  const msgs = [];
  const text = $("#addText").value.trim();
  if (text) msgs.push(`${(await api("/api/add", { text })).added} ASINs added`);
  const kind = $("#impKind").value;
  for (const f of $("#impFile").files) {
    try {
      const r = await api(`/api/import/${kind}`, { filename: f.name, content: await f.text(), buyer: $("#impBuyer").value, source: "upload" });
      msgs.push(kind === "orders" ? `${r.added} orders from ${f.name}` : `${r.products} products from ${f.name}`);
    } catch (e) { msgs.push(`${f.name}: ${e.message}`); }
  }
  if (!msgs.length) return toast("Paste ASINs or choose a file");
  $("#dlgAdd").close(); $("#addText").value = ""; $("#impFile").value = "";
  await api("/api/score", {}); toast(msgs.join(" · ")); load();
};
$("#btnScan").onclick = async () => {
  const r = await api("/api/score", {});
  toast(r.changes.length ? `${r.changes.length} new signal(s)` : "Scan done — nothing new"); load();
};

const dl = document.createElement("datalist"); dl.id = "stores";
dl.innerHTML = ["walmart","target","costco","samsclub","homedepot","lowes","bestbuy","cvs","walgreens","traderjoes","wholefoods","kohls","dollartree"].map((r) => `<option value="${r}">`).join("");
document.body.appendChild(dl);
load();
</script>
</body>
</html>
